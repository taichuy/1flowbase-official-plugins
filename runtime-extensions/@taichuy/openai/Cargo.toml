[package]
name = "openai-provider"
# Keep the package version aligned with the plugin release manifest.
version = "0.2.57"
edition = "2021"

[lib]
name = "openai_provider"
path = "src/lib.rs"

[dependencies]
provider-observation = { path = "../../../sdk/provider-observation" }
anyhow = "1"
base64 = "0.22"
eventsource-stream = "0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

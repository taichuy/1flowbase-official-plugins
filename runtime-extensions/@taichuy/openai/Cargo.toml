[package]
name = "openai-provider"
# Keep the package version aligned with the plugin release manifest.
version = "0.2.77"
edition = "2021"

[lib]
name = "openai_provider"
path = "src/lib.rs"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "aedddaa4b01cece7b6269547d1cf59b78271e1db" }
provider-observation = { path = "../../../sdk/provider-observation" }
anyhow = "1"
base64 = "0.22"
eventsource-stream = "0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# Match Codex's RFC 7692 implementation; both dependencies use the same pinned source.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", default-features = false, features = ["deflate"] }

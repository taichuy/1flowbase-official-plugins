manifest_version: 1
plugin_id: openai
publisher_namespace: 1flowbase
version: 0.2.29
vendor: 1flowbase
display_name: OpenAI
description: OpenAI Responses API provider runtime extension
icon: icon.svg
source_kind: official_registry
trust_level: verified_official
consumption_kind: runtime_extension
execution_mode: stateful_provider_worker
slot_codes:
  - model_provider
keywords:
  - openai
  - responses
binding_targets:
  - workspace
selection_mode: assignment_then_select
minimum_host_version: 0.3.1
contract_version: 1flowbase.provider/v2
schema_version: 1flowbase.plugin.manifest/v1
permissions:
  network: outbound_only
  secrets: provider_instance_only
  storage: none
  mcp: none
  subprocess: deny
runtime:
  protocol: stdio_json_worker
  entry: bin/openai-provider
  capabilities:
    - config.validate
    - models.list
    - count_tokens
    - compact.responses_compact
    - compact.responses_compaction_v2
    - responses.native_passthrough
    - reasoning_output_supported
    - native_continuation_supported
    - protocol_context.restore.openai_chat.v1
    - protocol_context.restore.openai_responses.v1
  limits:
    timeout_ms: 30000
    memory_bytes: 268435456
node_contributions: []

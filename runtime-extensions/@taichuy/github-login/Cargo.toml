[package]
name = "github-login"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-managed GitHub authentication provider for 1flowbase"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "a72190c9b7e3ee8e800bf249d2db8e55ca8aac10" }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
time = { version = "0.3", features = ["parsing"] }

[package]
name = "github-login"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-managed GitHub authentication provider for 1flowbase"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "ac37a8428ffc9f39ee358f9c69081894ba15ea56" }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
time = { version = "0.3", features = ["parsing"] }

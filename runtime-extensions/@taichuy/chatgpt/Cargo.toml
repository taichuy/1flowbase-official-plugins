[package]
name = "chatgpt-provider"
# Cargo requires a package version, but plugin release version is sourced from manifest.yaml.
version = "0.0.0"
edition = "2021"

[lib]
name = "chatgpt_provider"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
eventsource-stream = "0.2.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "json", "rustls-tls", "stream"] }
sha2 = "0.10"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

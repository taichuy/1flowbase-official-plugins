[package]
name = "google-search-console"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
description = "Host-managed Google Search Console OAuth connections, search analytics, sitemaps, URL inspection, and MCP tools"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "5a24c132f463a39423e2a368fa5ce06b1d8e3929" }
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }

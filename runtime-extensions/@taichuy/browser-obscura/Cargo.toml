[package]
name = "browser-obscura"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Actor and workspace isolated managed browser for 1flowbase"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "8f430833b27e0cfcde625a6df5207d4cc8960fe7" }
obscura-browser = { git = "https://github.com/h4ckf0r0day/obscura", rev = "fdeac4421eaab3b1f0c26c71c2214fa5c8ad2fb9", features = ["render"] }
obscura-dom = { git = "https://github.com/h4ckf0r0day/obscura", rev = "fdeac4421eaab3b1f0c26c71c2214fa5c8ad2fb9" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"

# Dependency workspaces do not propagate their patches. Preserve upstream's
# grid shrink-to-fit and variable-font fixes at exactly the engine revision.
[patch.crates-io]
taffy = { git = "https://github.com/h4ckf0r0day/obscura", rev = "fdeac4421eaab3b1f0c26c71c2214fa5c8ad2fb9" }
cosmic-text = { git = "https://github.com/h4ckf0r0day/obscura", rev = "fdeac4421eaab3b1f0c26c71c2214fa5c8ad2fb9" }

[profile.release]
panic = "unwind"

[package]
name = "clash-proxy-provider"
version = "0.0.0"
edition = "2021"

[lib]
name = "clash_proxy_provider"
path = "src/lib.rs"

[[bin]]
name = "clash-proxy-provider"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

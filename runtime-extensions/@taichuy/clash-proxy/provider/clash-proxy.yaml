provider_code: clash-proxy
display_name: Clash / Mihomo Proxy
protocol: stdio_json_worker
model_discovery: none
contract_version: 1flowbase.network_egress_provider/v1
secret_input:
  startup_argument: --network-egress-config-file
  carrier: json_string
  format: subscription_url_v1
  allowed_proxy_types:
    - ss
    - vmess
    - vless
    - trojan
  forbidden_inputs:
    - base64
    - provider
    - v2ray_json
runtime_core:
  command: runtime-core/<target-triple>/1flowbase-runtime-core
  listener: 127.0.0.1 only
  protocols:
    - http
    - mixed
  forbidden_features:
    - tun
    - system_proxy
    - public_listener
    - runtime_download

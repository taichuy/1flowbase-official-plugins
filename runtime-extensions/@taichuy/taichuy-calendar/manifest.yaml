managed_service:
  scope: system
  operations:
    - interface_id: taichuy-calendar.calendar.month
      contribution_id: taichuy-calendar.calendar.month
      method: POST
      path: "/api/console/managed-services/taichuy-calendar/calendar/month"
      summary: "Month calendar"
      description: "Month calendar; deterministic bundled npm computation; no runtime Node dependency"
      execution_concurrency: parallel
      input_schema:
        type: object
        properties:
          path:
            type: object
            properties: {}
            required: []
            additionalProperties: false
          query:
            type: object
            properties: {}
            required: []
            additionalProperties: false
          body:
            type: object
            properties:
              year:
                type: integer
              month:
                type: integer
                minimum: 1
                maximum: 12
            required: ["year","month"]
            additionalProperties: false
        required: ["path","query","body"]
        additionalProperties: false
      output_schema:
        oneOf:
          - type: object
            properties:
              ok:
                const: true
              data:
                type: object
                properties:
                  year:
                    type: integer
                  month:
                    type: integer
                  first_weekday:
                    type: integer
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        civil_date:
                          type: string
                          pattern: "^[+-]?[0-9]{4,6}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
                        weekday:
                          type: integer
                        lunar:
                          type: object
                          properties:
                            year:
                              type: integer
                            month:
                              type: integer
                            day:
                              type: integer
                            is_leap_month:
                              type: boolean
                            month_text:
                              type: string
                            day_text:
                              type: string
                            year_gan_zhi:
                              type: string
                            month_gan_zhi:
                              type: string
                            day_gan_zhi:
                              type: string
                            zodiac:
                              type: string
                          required: ["year","month","day","is_leap_month","month_text","day_text","year_gan_zhi","month_gan_zhi","day_gan_zhi","zodiac"]
                          additionalProperties: false
                        solar_term:
                          type: string
                        festivals:
                          type: array
                          items:
                            type: string
                      required: ["civil_date","weekday","lunar","solar_term","festivals"]
                      additionalProperties: false
                required: ["year","month","first_weekday","days"]
                additionalProperties: false
            required: ["ok","data"]
            additionalProperties: false
          - type: object
            properties:
              ok:
                const: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum: ["invalid_input","invalid_date","invalid_region","unsupported_operation","calculation_failed"]
                  message:
                    type: string
                    minLength: 1
                required: ["code","message"]
                additionalProperties: false
            required: ["ok","error"]
            additionalProperties: false

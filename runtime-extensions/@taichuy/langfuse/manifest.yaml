manifest_version: 2
schema_version: 1flowbase.plugin.manifest/v2
plugin_id: langfuse
version: 0.1.0
publisher_namespace: 1flowbase
vendor: 1flowbase
display_name: Langfuse
description: Lossless bidirectional application log exchange with Langfuse
source_kind: official_registry
trust_level: verified_official
consumption_kind: runtime_extension
execution_mode: process_per_call
slot_codes: []
binding_targets: [system]
selection_mode: assignment_then_select
minimum_host_version: 0.5.6
contract_version: 1flowbase.extension-bus/v1
permissions:
  network: outbound_only
  secrets: host_managed
  storage: host_managed
  mcp: none
  subprocess: deny
runtime:
  protocol: stdio_json_multiplex_v1
  entry: bin/langfuse
data_models:
  - contribution_version: 1flowbase.plugin-data-model/v1
    storage_binding: main
    owned_collections:
      - collection_code: connection
        fields:
          - field_code: name
            field_type: string
          - field_code: base_url
            field_type: string
managed:
  module:
    bus_version: v1
    module_id: langfuse
    module_version: 0.1.0
    module_kind: runtime
    contributions:
      - contribution_id: langfuse.config_get
        contributor_module_id: langfuse
        point_id: 1flowbase.managed-service.operation
        contract_version: '1'
        required_permissions: ["service.execute", "plugin_data.owned.write", "credential.manage"]
        mode: append
      - contribution_id: langfuse.config_put
        contributor_module_id: langfuse
        point_id: 1flowbase.managed-service.operation
        contract_version: '1'
        required_permissions: ["service.execute", "plugin_data.owned.write", "credential.manage"]
        mode: append
      - contribution_id: langfuse.test
        contributor_module_id: langfuse
        point_id: 1flowbase.managed-service.operation
        contract_version: '1'
        required_permissions: ["service.execute", "plugin_data.owned.write", "credential.manage", "network.http.request"]
        mode: append
      - contribution_id: langfuse.applications
        contributor_module_id: langfuse
        point_id: 1flowbase.managed-service.operation
        contract_version: '1'
        required_permissions: ["service.execute", "application.logs.read"]
        mode: append
      - contribution_id: langfuse.records_query
        contributor_module_id: langfuse
        point_id: 1flowbase.managed-service.operation
        contract_version: '1'
        required_permissions: ["service.execute", "application.logs.read"]
        mode: append
      - contribution_id: langfuse.export
        contributor_module_id: langfuse
        point_id: 1flowbase.managed-service.operation
        contract_version: '1'
        required_permissions: ["service.execute", "plugin_data.owned.write", "credential.manage", "application.logs.read", "network.http.request"]
        mode: append
      - contribution_id: langfuse.import
        contributor_module_id: langfuse
        point_id: 1flowbase.managed-service.operation
        contract_version: '1'
        required_permissions: ["service.execute", "plugin_data.owned.write", "credential.manage", "application.logs.read", "application.logs.import", "network.http.request"]
        mode: append
      - contribution_id: langfuse.data
        contributor_module_id: langfuse
        point_id: 1flowbase.plugin-data.owned-collection
        contract_version: 1flowbase.plugin-data-model/v1
        required_permissions: [plugin_data.owned.write]
        mode: append
  execution_bindings:
    - contribution_id: langfuse.config_get
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json_multiplex_v1
        entry: bin/langfuse
      handler: config_get
    - contribution_id: langfuse.config_put
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json_multiplex_v1
        entry: bin/langfuse
      handler: config_put
    - contribution_id: langfuse.test
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json_multiplex_v1
        entry: bin/langfuse
      handler: test
    - contribution_id: langfuse.applications
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json_multiplex_v1
        entry: bin/langfuse
      handler: applications
    - contribution_id: langfuse.records_query
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json_multiplex_v1
        entry: bin/langfuse
      handler: records_query
    - contribution_id: langfuse.export
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json_multiplex_v1
        entry: bin/langfuse
      handler: export
    - contribution_id: langfuse.import
      execution_mode: process_per_call
      runtime:
        protocol: stdio_json_multiplex_v1
        entry: bin/langfuse
      handler: import
    - contribution_id: langfuse.data
      execution_mode: declarative_only
      runtime:
        protocol: stdio_json
        entry: manifest.yaml
      handler: owned_collections
      payload:
        kind: data_models

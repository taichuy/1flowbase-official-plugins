[package]
name = "wechat-chat-channels"
version = "3.0.0"
edition = "2021"
license = "MIT"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "3b4ab9abbf15beb66dc84fbc56611b4f76486db6" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
serde_yaml = "=0.9.34"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
aws-lc-rs = "=1.16.3"

[package]
name = "wechat-notification"
version = "0.0.0"
edition = "2021"
license = "MIT"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "948f41cad5b2f951c748a0a0104464588b95d88d" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

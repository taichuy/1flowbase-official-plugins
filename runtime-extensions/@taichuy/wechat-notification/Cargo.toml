[package]
name = "wechat-notification"
version = "0.0.0"
edition = "2021"
license = "MIT"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "81a7268ab9111082bddd754aaf8e256047581a72" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
serde_yaml = "=0.9.34"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[package]
name = "wechat-notification"
version = "2.0.0"
edition = "2021"
license = "MIT"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "78bb5f7ab86fc889ea7fe1cfcad5ab693e19366a" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
serde_yaml = "=0.9.34"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
aws-lc-rs = "=1.16.3"

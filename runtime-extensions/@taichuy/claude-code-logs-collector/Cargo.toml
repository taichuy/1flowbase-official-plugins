[package]
name = "claude-code-logs-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
agent-logs-collector = { path = "../../../sdk/agent-logs-collector" }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }

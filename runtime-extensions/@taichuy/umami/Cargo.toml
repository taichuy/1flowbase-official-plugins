[package]
name = "umami"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-managed Umami connections and authenticated API operations"

[dependencies]
runtime-extension-sdk = { git = "https://github.com/taichuy/1flowbase.git", rev = "ac37a8428ffc9f39ee358f9c69081894ba15ea56" }
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }

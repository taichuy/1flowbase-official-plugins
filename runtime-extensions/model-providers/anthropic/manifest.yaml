manifest_version: 1
plugin_id: anthropic
version: 0.1.33
vendor: 1flowbase
display_name: Anthropic
description: Anthropic Messages API provider runtime extension
icon: icon.svg
source_kind: official_registry
trust_level: verified_official
consumption_kind: runtime_extension
execution_mode: process_per_call
slot_codes:
  - model_provider
binding_targets:
  - workspace
selection_mode: assignment_then_select
minimum_host_version: 0.3.1
contract_version: 1flowbase.provider/v2
schema_version: 1flowbase.plugin.manifest/v1
permissions:
  network: outbound_only
  secrets: provider_instance_only
  storage: none
  mcp: none
  subprocess: deny
runtime:
  protocol: stdio_json
  entry: bin/anthropic-provider
  capabilities:
    - system_prompt_blocks
    - system_prompt_cache_control
    - end_user_reference
    - count_tokens
    - message_blocks.reasoning_history.v1
    - message_blocks.redacted_reasoning_history.v1
    - protocol_context.restore.anthropic_messages.v2
  limits:
    timeout_ms: 30000
    invoke_timeout_ms: 300000
    memory_bytes: 268435456
node_contributions: []

name: extension-catalog

on:
  pull_request:
    paths:
      - 'agent-flow/**'
      - 'capability-plugins/**'
      - 'host-extensions/**'
      - 'i18n/**'
      - 'mcp/**'
      - 'runtime-extensions/**'
      - 'official-registry.json'
      - 'schemas/extension-catalog/**'
      - 'scripts/*catalog*.mjs'
      - 'scripts/_tests/*catalog*.test.mjs'
      - '.github/workflows/extension-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate all static catalogs
        run: node scripts/update-extension-catalog.mjs
      - name: Detect catalog drift on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- '*/catalog/v1/**' '*/_maintenance/catalog-state.json'
      - name: Commit manually rebuilt catalogs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git add -- '*/catalog/v1/**' '*/_maintenance/catalog-state.json'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild extension catalogs"
          git push

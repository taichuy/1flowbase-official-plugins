name: mcp-bundle-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mcp/@*/**'
      - 'scripts/*mcp*.mjs'
      - 'scripts/_tests/*mcp*.test.mjs'
      - 'scripts/extension-catalog.mjs'
      - '.github/workflows/mcp-bundle-release.yml'

permissions:
  contents: write

concurrency:
  group: mcp-bundle-release-main
  cancel-in-progress: false

jobs:
  detect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      has_releases: ${{ steps.releases.outputs.has_releases }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate MCP publisher contract
        run: node --test scripts/_tests/*mcp*.test.mjs
      - name: Detect source-declared releases
        id: releases
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${base_ref}" ]; then base_ref="HEAD^"; fi
          matrix="$(node scripts/detect-mcp-version-releases.mjs "${base_ref}" "${{ github.sha }}")"
          count="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).include.length))' "${matrix}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          if [ "${count}" -gt 0 ]; then echo "has_releases=true" >> "${GITHUB_OUTPUT}"; else echo "has_releases=false" >> "${GITHUB_OUTPUT}"; fi

  release:
    needs: detect
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate signing configuration
        env:
          MCP_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_PRIVATE_KEY_PEM }}
          MCP_SIGNING_KEY_ID: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MCP_SIGNING_PRIVATE_KEY_PEM}" || { echo "OFFICIAL_PLUGIN_SIGNING_PRIVATE_KEY_PEM is required" >&2; exit 1; }
          test -n "${MCP_SIGNING_KEY_ID}" || { echo "OFFICIAL_PLUGIN_SIGNING_KEY_ID is required" >&2; exit 1; }
      - name: Build, sign exact ZIP bytes, and publish immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_PRIVATE_KEY_PEM }}
          MCP_SIGNING_KEY_ID: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/records dist/existing
          key_file="${RUNNER_TEMP}/mcp-ed25519-private.pem"
          printf '%s' "${MCP_SIGNING_PRIVATE_KEY_PEM}" > "${key_file}"
          chmod 600 "${key_file}"
          trap 'rm -f "${key_file}"' EXIT

          node scripts/update-mcp-catalog.mjs validate --bundle-root "${{ matrix.bundle_dir }}"
          asset_path="dist/${{ matrix.asset_name }}"
          (
            cd "${{ matrix.bundle_dir }}"
            bundle_entries=(manifest.json tools instances)
            if [ -d connections ]; then bundle_entries+=(connections); fi
            find "${bundle_entries[@]}" -type f -exec touch -t 198001010000 {} +
            find "${bundle_entries[@]}" -type f -print | LC_ALL=C sort | zip -X -q "${GITHUB_WORKSPACE}/${asset_path}" -@
          )
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ matrix.release_tag }}/${{ matrix.asset_name }}"
          raw_record="dist/records/raw.json"
          node scripts/update-mcp-catalog.mjs sign \
            --artifact "${asset_path}" \
            --bundle-root "${{ matrix.bundle_dir }}" \
            --private-key "${key_file}" \
            --key-id "${MCP_SIGNING_KEY_ID}" \
            --download-url "${download_url}" \
            --output "${raw_record}"
          node -e 'const fs=require("fs"); const record=JSON.parse(fs.readFileSync(process.argv[1])); fs.writeFileSync(process.argv[2], JSON.stringify({organization:process.argv[3],bundle_id:process.argv[4],record})+"\n")' \
            "${raw_record}" "dist/records/${{ matrix.organization }}-${{ matrix.bundle_id }}.json" "${{ matrix.organization }}" "${{ matrix.bundle_id }}"
          rm "${raw_record}"

          if gh release view "${{ matrix.release_tag }}" >/dev/null 2>&1; then
            gh release download "${{ matrix.release_tag }}" --pattern "${{ matrix.asset_name }}" --dir dist/existing
            cmp -- "${asset_path}" "dist/existing/${{ matrix.asset_name }}" || {
              echo "Immutable MCP Release asset conflict: ${{ matrix.release_tag }}/${{ matrix.asset_name }}" >&2
              exit 1
            }
          else
            gh release create "${{ matrix.release_tag }}" "${asset_path}" \
              --target "${GITHUB_SHA}" \
              --title "MCP ${{ matrix.organization }}/${{ matrix.bundle_id }} v${{ matrix.version }}" \
              --notes "Signed immutable MCP bundle release."
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: mcp-release-record-${{ matrix.organization }}-${{ matrix.bundle_id }}
          path: dist/records/*.json

  update-catalog:
    needs: [detect, release]
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: mcp-release-record-*
          path: release-records
          merge-multiple: true
      - name: Generate history-preserving signed catalog
        run: node scripts/update-mcp-catalog.mjs update --repo-root . --records-dir release-records
      - name: Refresh MCP discovery catalog
        run: node scripts/update-extension-catalog.mjs --category mcp
      - name: Commit generated MCP catalogs
        shell: bash
        run: |
          set -euo pipefail
          git add mcp/catalog.json mcp/_maintenance mcp/catalog
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: publish signed MCP bundle catalog"
          git push origin main

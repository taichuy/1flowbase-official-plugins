name: collector-release

on:
  push:
    branches: [main]
    paths:
      - 'sdk/agent-logs-collector/**'
      - 'runtime-extensions/@taichuy/*/collector-manifest.json'
      - 'runtime-extensions/@taichuy/*-logs-collector/**'
      - 'installers/client-collectors/**'
      - 'scripts/collectors/**'
      - 'scripts/extension-catalog.mjs'
      - 'schemas/extension-catalog/**'
      - '.github/workflows/collector-release.yml'
      - '!runtime-extensions/@taichuy/*/catalog-entry.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/collectors
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      has_builds: ${{ steps.matrix.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native protocol and recovery behavior
        run: |
          for manifest in runtime-extensions/@taichuy/*-logs-collector/Cargo.toml; do
            cargo test --locked --manifest-path "$manifest"
          done
          cargo test --locked --manifest-path sdk/agent-logs-collector/Cargo.toml
      - name: Verify client/host isolation and installer behavior
        env:
          FLOWBASE_COLLECTOR_TEST_BINARY: ${{ github.workspace }}/target/collectors/debug/codex-logs-collector
        run: |
          for manifest in runtime-extensions/@taichuy/*-logs-collector/Cargo.toml; do
            cargo build --locked --manifest-path "$manifest"
          done
          node --test runtime-extensions/@taichuy/deepseek-harness-logs-collector/native/plugin.test.mjs runtime-extensions/@taichuy/opencode-logs-collector/src/_tests/plugin.test.mjs
          node --test scripts/collectors/_tests/*.test.mjs scripts/_tests/extension-catalog.test.mjs
          bash -n installers/client-collectors/install.sh
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$(node scripts/collectors/release-plan.mjs)"
          echo "value=$plan" >> "$GITHUB_OUTPUT"
          echo "has_builds=$(jq -r '.include | length > 0' <<< "$plan")" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    if: needs.verify.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install cross (official Linux musl build mechanism)
        if: matrix.os == 'linux'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build native collector
        shell: bash
        run: |
          if [ '${{ matrix.os }}' = linux ]; then
            cross build --locked --release --manifest-path '${{ matrix.plugin_dir }}/Cargo.toml' --target '${{ matrix.rust_target }}'
          else
            cargo build --locked --release --manifest-path '${{ matrix.plugin_dir }}/Cargo.toml' --target '${{ matrix.rust_target }}'
          fi
      - name: Package client executable
        shell: bash
        run: |
          binary='${{ matrix.plugin_dir }}/target/${{ matrix.rust_target }}/release/${{ matrix.entry }}'
          if [ '${{ matrix.os }}' = windows ]; then binary="${binary}.exe"; fi
          node scripts/collectors/package.mjs '${{ matrix.collector_code }}' '${{ matrix.rust_target }}' "$binary" dist/collectors
      - uses: actions/upload-artifact@v7
        with:
          name: collector-${{ matrix.collector_code }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/collectors/*
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        if: needs.verify.outputs.has_builds == 'true'
        with:
          pattern: collector-*
          path: dist/collectors
          merge-multiple: true
      - name: Publish immutable signed client releases
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_KEY_PEM || secrets.OFFICIAL_PLUGIN_SIGNING_PRIVATE_KEY_PEM }}
          OFFICIAL_PLUGIN_SIGNING_KEY_ID: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_KEY_ID }}
        run: node scripts/collectors/publish.mjs
      - name: Publish verified distribution to the official extension catalog
        shell: bash
        run: |
          set -euo pipefail
          publish_worktree="$(mktemp -d)"
          trap 'git worktree remove --force "${publish_worktree}" >/dev/null 2>&1 || true' EXIT
          git fetch origin main
          git worktree add --detach "${publish_worktree}" origin/main
          # Copy only canonical entries generated after published-byte verification.
          while IFS= read -r entry; do
            cp "$entry" "${publish_worktree}/$entry"
          done < <(find runtime-extensions -name collector-manifest.json -exec dirname {} \; | sed 's|$|/catalog-entry.json|')
          cd "${publish_worktree}"
          node scripts/update-extension-catalog.mjs --category runtime-extensions
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- 'runtime-extensions/@*/**/catalog-entry.json' runtime-extensions/catalog/v1 runtime-extensions/_maintenance/catalog-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: publish verified client collector distribution catalog'
          git push origin HEAD:main

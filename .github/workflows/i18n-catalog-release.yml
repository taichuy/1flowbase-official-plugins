name: i18n-catalog-release

on:
  pull_request:
    paths:
      - 'i18n/**'
      - 'scripts/i18n-catalog*.mjs'
      - 'scripts/_tests/i18n-catalog*.test.mjs'
      - '.github/workflows/i18n-catalog-release.yml'
  push:
    branches: [main]
    tags: ['i18n-catalog-v*.*.*']
    paths:
      - 'i18n/**'
      - 'scripts/i18n-catalog*.mjs'
      - 'scripts/_tests/i18n-catalog*.test.mjs'
      - '.github/workflows/i18n-catalog-release.yml'
  workflow_dispatch:

concurrency:
  group: i18n-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify source contract and canonical Seed
        run: |
          node --test scripts/_tests/i18n-catalog*.test.mjs
          node scripts/i18n-catalog-publisher.mjs --check
          node scripts/update-extension-catalog.mjs --category i18n --check

  immutable-release:
    if: startsWith(github.ref, 'refs/tags/i18n-catalog-v')
    needs: source-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Bind tag, catalog version, and digest
        id: release
        env:
          OFFICIAL_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_KEY_PEM || secrets.OFFICIAL_PLUGIN_SIGNING_PRIVATE_KEY_PEM }}
          OFFICIAL_PLUGIN_SIGNING_KEY_ID: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OFFICIAL_PLUGIN_SIGNING_KEY_PEM}" ] || [ -z "${OFFICIAL_PLUGIN_SIGNING_KEY_ID}" ]; then
            echo "Official Ed25519 signing key and key id are required." >&2
            exit 1
          fi
          version="$(node -p 'JSON.parse(require("fs").readFileSync("i18n/catalog.json", "utf8")).catalog_version')"
          expected_tag="i18n-catalog-v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match catalog version ${version}." >&2
            exit 1
          fi
          node scripts/i18n-catalog-publisher.mjs --check
          asset="i18n-catalog-seed-v${version}.json"
          cp i18n/dist/catalog-seed.json "${asset}"
          printf '%s' "${OFFICIAL_PLUGIN_SIGNING_KEY_PEM}" > i18n-signing-key.pem
          node scripts/i18n-release.mjs build \
            --private-key-pem-file i18n-signing-key.pem \
            --key-id "${OFFICIAL_PLUGIN_SIGNING_KEY_ID}" \
            --record i18n-release-record.json
          digest="$(sha256sum "${asset}" | awk '{print $1}')"
          printf '%s  %s\n' "${digest}" "${asset}" > "${asset}.sha256"
          node -p 'JSON.parse(require("fs").readFileSync("i18n-release-record.json", "utf8")).signature' \
            > "${asset}.sig"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "digest=sha256:${digest}" >> "${GITHUB_OUTPUT}"
      - name: Publish immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.release.outputs.asset }}
          DIGEST: ${{ steps.release.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            repair_dir="$(mktemp -d)"
            gh release download "${GITHUB_REF_NAME}" --pattern "${ASSET}" --dir "${repair_dir}"
            cmp "${ASSET}" "${repair_dir}/${ASSET}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${ASSET}" "${ASSET}.sha256" "${ASSET}.sig" i18n-release-record.json \
              --target "${GITHUB_SHA}" \
              --title "Official i18n catalog ${GITHUB_REF_NAME}" \
              --notes "Canonical Seed digest: ${DIGEST}"
          fi
      - name: Publish verified release evidence to the extension catalog
        env:
          OFFICIAL_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.OFFICIAL_PLUGIN_SIGNING_KEY_PEM || secrets.OFFICIAL_PLUGIN_SIGNING_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          publish_worktree="$(mktemp -d)"
          trap 'git worktree remove --force "${publish_worktree}" >/dev/null 2>&1 || true' EXIT
          git fetch origin main
          git worktree add --detach "${publish_worktree}" origin/main
          cp i18n-release-record.json "${publish_worktree}/i18n-release-record.json"
          printf '%s' "${OFFICIAL_PLUGIN_SIGNING_KEY_PEM}" > "${publish_worktree}/i18n-signing-key.pem"
          cd "${publish_worktree}"
          node scripts/i18n-catalog-publisher.mjs --check
          node scripts/i18n-release.mjs register \
            --private-key-pem-file i18n-signing-key.pem \
            --record i18n-release-record.json
          node scripts/update-extension-catalog.mjs --category i18n
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add i18n/releases/v1/catalog.json i18n/catalog/v1 i18n/_maintenance/catalog-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(i18n): publish signed ${GITHUB_REF_NAME} catalog evidence"
          git push origin HEAD:main

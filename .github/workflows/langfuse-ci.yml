name: Langfuse managed plugin evidence
on:
  push:
    branches: [codex/langfuse-ci]
  workflow_dispatch:
    inputs:
      host_source_sha:
        description: Exact host SDK and packaging source SHA
        required: true
        type: string
      official_source_sha:
        description: Exact official plugin source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: langfuse-${{ inputs.official_source_sha }}
  cancel-in-progress: false
jobs:
  plugin-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_OFFICIAL_SHA: ${{ inputs.official_source_sha || github.sha }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.official_source_sha || github.sha }}
      - name: Read exact host SDK source pin
        id: source
        env:
          REQUESTED_HOST_SHA: ${{ inputs.host_source_sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = fs.readFileSync('runtime-extensions/@taichuy/langfuse/Cargo.toml', 'utf8');
          const pin = manifest.match(/runtime-extension-sdk\s*=\s*\{[^}]*rev\s*=\s*"([a-f0-9]{40})"/)[1];
          if (process.env.REQUESTED_HOST_SHA) assert.equal(pin, process.env.REQUESTED_HOST_SHA);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `host=${pin}\n`);
          JS
      - uses: actions/checkout@v6
        with:
          repository: taichuy/1flowbase
          ref: ${{ steps.source.outputs.host }}
          path: dist/conformance-host
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-extensions/@taichuy/langfuse/target
          key: langfuse-${{ runner.os }}-${{ steps.source.outputs.host }}-${{ inputs.official_source_sha || github.sha }}
          restore-keys: |
            langfuse-${{ runner.os }}-${{ steps.source.outputs.host }}-
            langfuse-${{ runner.os }}-
      - name: Test and package exact public managed plugin
        env:
          EXPECTED_HOST_SHA: ${{ steps.source.outputs.host }}
        run: node scripts/ci-langfuse.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: langfuse-${{ inputs.official_source_sha || github.sha }}
          path: tmp/test-governance/langfuse
          if-no-files-found: error
          retention-days: 14
